name: Deploy Alfilaha Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Set the SSH_PRIVATE_KEY repository secret}"
          : "${VPS_USER:?Set the VPS_USER repository secret}"
          : "${VPS_HOST:?Set the VPS_HOST repository secret}"
          : "${VPS_PORT:?Set the VPS_PORT repository secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -p "$VPS_PORT" -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" <<'EOF'
            set -euo pipefail

            cd /var/www/alfilaha/be/
            git config --global --add safe.directory /var/www/alfilaha/be/
            git pull
            npm ci --omit=dev
            git restore --worktree -- yarn.lock
            # npm run db:migrate
            pm2 restart alfilaha-be --update-env
          EOF
